[project]
name = "agent-system"
version = "0.1.0"
description = "Production-oriented agent platform built on the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai-agents==0.22.0",
  "openai>=3,<4",
  "mcp>=1.19,<2",
  "litellm>=1.83.0,<2",
  "httpx>=0.28,<1",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "greenlet>=3.2,<4",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.2,<2",
  "jsonschema>=4.24,<5",
  "tiktoken>=0.12,<1",
  "pyyaml>=6.0,<7",
  "cryptography>=45,<51",
  "redis>=6,<8",
  "boto3>=1.39,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
agent-system = "agent_system.main:run"
agent-worker = "agent_system.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/agent_system/api.py" = ["B008"]
