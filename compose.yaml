name: omoikane

services:
  runtime:
    build: .
    command: ["node", "dist/bin/runtime.js"]
    environment:
      OMOIKANE_DATA_DIR: /data
      OMOIKANE_HOST: 0.0.0.0
      OMOIKANE_ALLOW_REMOTE: "true"
      OMOIKANE_RUN_CONCURRENCY: ${OMOIKANE_RUN_CONCURRENCY:-4}
      OMOIKANE_CORS_ORIGINS: ${OMOIKANE_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - omoikane-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  omoikane-data:
