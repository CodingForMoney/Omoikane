apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omoikane.fullname" . }}-api
  labels:
    {{- include "omoikane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omoikane.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "omoikane.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ include "omoikane.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/bin/runtime.js"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "omoikane.env" . | nindent 12 }}
            - name: AGENT_EMBEDDED_WORKER
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omoikane.fullname" . }}
  labels:
    {{- include "omoikane.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "omoikane.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
