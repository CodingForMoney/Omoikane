apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "omoikane.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "omoikane.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "omoikane.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "omoikane.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/bin/migrate.js"]
          env:
            {{- include "omoikane.env" . | nindent 12 }}
